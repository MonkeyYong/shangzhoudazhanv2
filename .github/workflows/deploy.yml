name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 防止重复部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests (sanity check before deploy)
        run: |
          pip install pytest
          pytest tests/ -v --tb=short

      - name: Prepare web/ for Pages
        run: |
          # 添加 .nojekyll 防止 Jekyll 干扰
          touch web/.nojekyll

          # 创建 GitHub Pages 部署目录（仅 web/ 内容）
          mkdir -p _deploy
          cp -r web/* _deploy/
          cp web/.nojekyll _deploy/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_deploy"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
